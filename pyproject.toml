[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobwatch-engine"
version = "0.1.0"
description = "Database-independent job board scraping engine for JobWatch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
]

[project.optional-dependencies]
legacy = [
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
include = ["jobwatch*"]
